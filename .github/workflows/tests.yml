name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # PyOpenGL обязателен: без него visualization3d не создаёт gl_widget
      # (falls back to label) — тесты 3D-зеркал падают с gl_widget = None
      - run: pip install pytest pytest-cov pytest-qt PyQt5 numpy matplotlib PyOpenGL
      - run: pytest tests/ -v --tb=short