[pytest]
testpaths = tests
python_files = test_*.py qa_*.py
python_functions = test_*
# Приложение на PyQt5: pytest-qt и matplotlib должны использовать ту же
# привязку (иначе qt_compat выбирает PySide6 и смешивает два Qt)
qt_api = pyqt5
markers =
    requires_extracted: нужен каталог extracted/ (локальные данные, не в git)
    requires_opal_dir: нужен extracted/opal_okb/ (локальные данные, не в git)
    requires_fil: нужны extracted/opal_okb/*.FIL — каталоги стёкол (не в git)
    requires_opj: нужны extracted/opal_okb/*.OPJ — системы (не в git)
    requires_lbo: нужны extracted/opal_okb/Lib/*.LBO — библиотеки (не в git)
    requires_prn_rt2250: нужен эталон extracted/opal_okb/RT__2250.PRN (не в git)
    requires_prn_rt2236: нужен эталон extracted/opal_okb/RT__2236.PRN (не в git)
    requires_pyopengl: нужен PyOpenGL — иначе visualization3d.gl_widget = None
